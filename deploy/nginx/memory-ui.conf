# Append to the memory service's existing server-level nginx snippet.
# Public UI release contains only these three code files, never runtime data.
# memory-ui-v2:start
location = /admin/memory-agent.html {
    auth_request /_qy_auth;
    error_page 401 = @qy_login;
    root /var/www/qiuyiwu-memory-ui/current;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
}
location = /assets/memory-center.js {
    root /var/www/qiuyiwu-memory-ui/current;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}
location = /assets/memory-center.css {
    root /var/www/qiuyiwu-memory-ui/current;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}
# memory-ui-v2:end
